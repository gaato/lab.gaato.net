<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#3158c9" />
		<meta name="robots" content="noindex" />
		<title>ページが見つかりません | gaato lab</title>
		<link rel="icon" href="/favicon.svg" />
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background: #f7f7f2;
				color: #17191f;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 1.5rem;
			}

			main {
				width: min(100%, 42rem);
				border: 1px solid #d8d9df;
				border-radius: 1.25rem;
				background: #fff;
				padding: clamp(1.5rem, 6vw, 4rem);
			}

			.status {
				margin: 0 0 1rem;
				color: #3158c9;
				font-size: 0.8rem;
				font-weight: 800;
				letter-spacing: 0.18em;
			}

			h1 {
				margin: 0;
				font-size: clamp(2.25rem, 8vw, 4.5rem);
				line-height: 1.05;
				letter-spacing: -0.055em;
			}

			p {
				margin: 1.25rem 0 0;
				line-height: 1.75;
			}

			.english {
				color: #626673;
				font-size: 0.95rem;
			}

			a {
				display: inline-flex;
				min-height: 3rem;
				align-items: center;
				margin-top: 2rem;
				border-radius: 0.75rem;
				background: #3158c9;
				color: #fff;
				font-weight: 800;
				padding: 0.75rem 1.25rem;
				text-decoration: none;
			}

			a:hover {
				background: #2447aa;
			}

			a:focus-visible {
				outline: 3px solid #17191f;
				outline-offset: 4px;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					background: #101218;
					color: #f4f5f8;
				}

				main {
					border-color: #363a46;
					background: #191c24;
				}

				.status {
					color: #9db3ff;
				}

				.english {
					color: #b8bdca;
				}

				a:focus-visible {
					outline-color: #f4f5f8;
				}
			}
		</style>
	</head>
	<body>
		<main aria-labelledby="not-found-heading">
			<p class="status">404 · GAATO LAB</p>
			<h1 id="not-found-heading">ページが見つかりません</h1>
			<p>URLが正しいか確認するか、ツール一覧へ戻ってください。</p>
			<p class="english" lang="en">
				Page not found. Check the URL or return to the tool collection.
			</p>
			<a href="/">ツール一覧へ戻る</a>
		</main>
	</body>
</html>
