<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f2f2f2" />
		<meta name="robots" content="noindex" />
		<title>Page not found | lab.gaato.net</title>
		<link rel="icon" href="/favicon.svg" />
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background: #f2f2f2;
				color: #1f2937;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100dvh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 1.5rem;
			}

			main {
				width: min(100%, 32rem);
				text-align: center;
			}

			.status {
				margin: 0;
				color: #6b7280;
				font-size: 0.875rem;
				font-weight: 600;
			}

			h1 {
				margin: 0.5rem 0 0;
				font-size: 1.875rem;
				line-height: 1.2;
			}

			p {
				margin: 1rem 0 0;
				line-height: 1.6;
			}

			.secondary {
				color: #6b7280;
				font-size: 0.95rem;
			}

			a {
				display: inline-flex;
				min-height: 3rem;
				align-items: center;
				margin-top: 2rem;
				justify-content: center;
				border-radius: 0.5rem;
				background: #605dff;
				color: #fff;
				font-weight: 600;
				padding: 0.75rem 1.25rem;
				text-decoration: none;
			}

			a:hover {
				background: #4c49d8;
			}

			a:focus-visible {
				outline: 3px solid #17191f;
				outline-offset: 4px;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					background: #1d232a;
					color: #a6adbb;
				}

				.status {
					color: #9ca3af;
				}

				.secondary {
					color: #9ca3af;
				}

				a:focus-visible {
					outline-color: #f4f5f8;
				}
			}
		</style>
	</head>
	<body>
		<main aria-labelledby="not-found-heading">
			<p class="status">404</p>
			<h1 id="not-found-heading">Page not found</h1>
			<p>Check the URL or return to the tool collection.</p>
			<p class="secondary" lang="ja">
				ページが見つかりません。URLが正しいか確認するか、ツール一覧へ戻ってください。
			</p>
			<a href="/"
				>Back to all tools / <span lang="ja">ツール一覧へ戻る</span></a
			>
		</main>
	</body>
</html>
