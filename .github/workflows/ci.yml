name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source and build
        run: bun run verify

      - name: Validate Cloudflare bundle
        run: bun run deploy:dry-run

      - name: Set up Chrome
        id: setup-chrome
        # browser-actions/setup-chrome v2.2.0
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4

      - name: Check rendered site
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SITE_URL: http://127.0.0.1:4173
        run: |
          bunx wrangler dev --local --ip 127.0.0.1 --port 4173 > /tmp/lab-wrangler.log 2>&1 &
          wrangler_pid=$!
          trap 'kill "$wrangler_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$SITE_URL/" > /dev/null; then
              break
            fi
            if ! kill -0 "$wrangler_pid" 2>/dev/null; then
              cat /tmp/lab-wrangler.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/lab-wrangler.log
              exit 1
            fi
            sleep 1
          done

          bunx pa11y-ci
          bun run smoke
          bun run smoke:browser

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: lab-gaato-net-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static assets
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
        run: bun run deploy

      - name: Check production
        if: vars.PRODUCTION_URL != ''
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for attempt in {1..12}; do
            if bun run smoke; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done
